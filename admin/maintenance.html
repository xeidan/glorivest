<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maintenance • Glorivest</title>

    <link rel="icon" href="favicon.png">

    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="maintenance.css">

    <script defer src="maintenance.js"></script>
</head>

<body class="maintenance-body">

<div class="background-glow glow-1"></div>
<div class="background-glow glow-2"></div>

<main class="maintenance-wrapper">

    <img
        src="glorivest-logo.png"
        class="logo"
        alt="Glorivest"
    >

    <div class="glass-card">

        <div class="icon">
            🛠️
        </div>

        <h1 id="maintenance-title">
            We'll be back shortly
        </h1>

        <p id="maintenance-message">
            We are performing scheduled maintenance.
        </p>

        <div
            id="countdown-container"
            class="hidden"
        >
            <span>Estimated completion</span>

            <h2 id="countdown">
                --:--:--
            </h2>
        </div>

        <div class="status">
            Checking automatically...
        </div>

    </div>

</main>

</body>
</html>
